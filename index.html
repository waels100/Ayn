/* =====================================================================
   الإصدار 1.2 — تجربة الجوال الجديدة
   الشريط العلوي (كبسولة التنبيهات والصورة)، كومة اليوم، البوصلة والحبّة الحيّة،
   العدسة، خيط التسليم، قصة الأسبوع، شارة التطبيق
   ===================================================================== */

/* ---------- التنبيهات غير المقروءة ---------- */
const NSEEN_KEY=()=>`ayn-nseen-${(S.user&&(S.user.username||S.user.name))||'x'}`;
function notifItems(){
  const r=role(),mine=me();
  return S.cases.filter(c=>r!=='field'||c.assignee===mine)
    .flatMap(c=>(c.updates||[]).map(u=>({...u,id:c.id})))
    .filter(u=>u.who!==mine).sort((a,b)=>b.at-a.at).slice(0,40)}
function notifSeen(){let v=null;try{v=localStorage.getItem(NSEEN_KEY())}catch(e){}
  if(v==null){v=String(NOW-4*DAY);try{localStorage.setItem(NSEEN_KEY(),v)}catch(e){}}return +v}
function unreadCount(){const s=notifSeen();return notifItems().filter(u=>u.at>s).length}
function markNotifSeen(){try{localStorage.setItem(NSEEN_KEY(),String(Math.max(NOW,Date.now())))}catch(e){}
  $$('.tb-badge').forEach(b=>b.remove());$$('.tb-bell').forEach(b=>b.classList.remove('has'))}
function notifIcon(u){const t=u.text||'';if(u.kind==='comment')return ['chat','#12A88A'];if(/^أُسند|^أُعيد الإسناد/.test(t))return ['swap','#7A64E8'];
  if(/^تحقق/.test(t))return ['eye','#2E84E6'];if(/للمكتبي/.test(t))return ['send','#C07A2B'];if(/^استُكملت/.test(t))return ['doc','#00896F'];
  if(/^أُغلقت|ممتثل/.test(t))return ['check','#0B1420'];if(/^بلاغ|^تدوين/.test(t))return ['camera','#1E7FD6'];return ['bell','#5C7488']}
function sheetNotif(){
  const items=notifItems().slice(0,20),seen=notifSeen();
  const day0=new Date(NOW);day0.setHours(0,0,0,0);
  const groups=[['اليوم',items.filter(u=>u.at>=+day0)],['سابقاً',items.filter(u=>u.at<+day0)]].filter(g=>g[1].length);
  openSheet(`${SH('التنبيهات',items.length?'آخر ما حدث في مخالفاتك':'لا جديد')}
    <div class="nt">${groups.map(([g,list])=>`<div class="nt-g">${g}</div>${list.map(u=>{const [i,col]=notifIcon(u);const isNew=u.at>seen;
      return `<button class="nt-r ${isNew?'new':''}" data-act="${u.kind==='comment'?'thread':'open-case-sheet'}" data-id="${u.id}">
        <span class="nt-i" style="color:${col}">${ic(i)}</span>
        <span class="nt-x"><b>${u.kind==='comment'?`${esc(u.who)}: ${esc(u.text)}`:esc(u.text)}</b><span><span class="num">${u.id}</span> · ${u.kind==='comment'?'محادثة':esc(u.who)} · ${rel(u.at)}</span></span>
        ${isNew?'<i class="nt-dot"></i>':''}</button>`}).join('')}`).join('')||`<div class="empty">${ic('bell')}لا تنبيهات بعد</div>`}</div>`);
  setTimeout(markNotifSeen,400)}

/* ---------- كبسولة الشريط العلوي ---------- */
function tbCapsule(showMe){
  if(!role()||role()==='collab')return '';
  const n=unreadCount(),story=showMe&&storyReady();
  return `<div class="tb-cap">
    <button class="tb-bell ${n?'has':''}" data-act="notif" aria-label="التنبيهات${n?`، ${n} جديدة`:''}">${ic('bell')}${n?`<b class="tb-badge num">${n>9?'9+':n}</b>`:''}</button>
    ${showMe?`<button class="tb-me ${story?'story':''}" data-act="${story?'story':'tab'}" data-tab="${PROFILE_TAB[role()]}" aria-label="${story?'قصة أسبوعك':'ملفي'}"><span class="tb-ring">${avatar(me())}</span></button>`:''}
  </div>`}
function fmtDist(m){if(m==null)return '…';return m<1000?`${Math.round(m/10)*10} م`:`${(m/1000).toFixed(1)} كم`}

/* ---------- كومة اليوم (رئيسية الميداني) ---------- */
function hashN(s){let h=0;for(const ch of String(s))h=(h*31+ch.charCodeAt(0))>>>0;return h}
function lastNote(c){const u=[...(c.updates||[])].reverse().find(x=>x.kind==='comment'&&x.who!==me());return u||null}
/* ---------- مهمتك الآن: خريطة واحدة للجولة + بطاقات متزامنة معها ---------- */
function missionStops(list){
  const me0=NAV.pos||ME_LOC;
  const urgent=list.filter(c=>ageDays(c)>=10).sort((a,b)=>ageDays(b)-ageDays(a))[0]||null;
  return urgent?[urgent,...routeOrder(list.filter(c=>c!==urgent),{lat:urgent.lat,lng:urgent.lng})]:routeOrder(list,me0)}
function msCard(c,i){const t=TYPES[c.type],x=slaInfo(c),eta=Math.max(2,Math.round(c.dist*4)),n=lastNote(c),why=whyFirst(c,i),visit=c.status==='field'&&!c.verified;
  const rem=x.closed?'—':x.d>14?`+${Math.floor(x.d-14)||1}`:String(Math.max(0,Math.ceil(14-x.d)));
  return `<article class="ms-card" data-i="${i}" data-id="${c.id}">
    <div class="msc-row"><span class="msc-k num">${i+1}</span>${why?`<span class="dk-why ${why[0]}"><i></i>${why[1]}</span>`:'<span></span>'}<span class="msc-id num">${c.id}</span></div>
    <div class="dk-top"><div class="dk-ttl"><span class="dk-kicker"><i style="background:${t.c}"></i>${t.l}${c.meter?` · عداد <span class="num">${esc(c.meter)}</span>`:''}</span><b>${esc(c.title)}</b></div>${eyeGauge(c,'lg')}</div>
    <div class="dk-stats"><div><b class="num">${c.dist}</b><span>كم عنك</span></div><div><b class="num">${eta}</b><span>دقائق تقريباً</span></div>
      <div class="${x.tone}"><b class="num">${rem}</b><span>${x.d>14&&!x.closed?'يوماً متأخرة':'أيام متبقية'}</span></div></div>
    ${n?`<button class="dk-quote" data-act="thread" data-id="${c.id}"><span class="dq-m">”</span><span class="dq-t">${esc(n.text)}</span><span class="dq-w">${esc(n.who.split(' ')[0])}</span></button>`
       :`<button class="dk-by" data-act="thread" data-id="${c.id}">${avatar(c.assignedBy||'المكتب','sm')}<span>أسندها ${esc(c.assignedBy||'المكتب')}${c.assignedAt?` ${rel(c.assignedAt)}`:''} · ${esc(sourceLabel(c))}</span>${ic('chat')}</button>`}
    <div class="dk-acts ${visit?'two':''}">${visit?`<button class="dk-dir" data-act="directions" data-id="${c.id}" aria-label="الاتجاهات إلى المخالفة في خرائط Google" title="الاتجاهات في خرائط Google"><span class="dd-dia"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 16.5V11.2C8 10.5 8.5 10 9.2 10H14V7.2L18.2 11.4L14 15.6V12.8H10.4V16.5Z" fill="#FFFFFF"/></svg></span><span class="dd-t">اتجاهات</span></button>`:''}
      <button class="dk-go" data-act="open-case" data-id="${c.id}"><span>فتح المهمة</span><i class="dk-arr">${ic('back')}</i></button></div>
  </article>`}
function missionHTML(list){
  if(!list.length)return `<section class="ms"><div class="ms-empty">${ic('check')}<b>لا مهام مفتوحة لك الآن</b><span>حين يُسند إليك المكتب مخالفة تظهر هنا على خريطة جولتك.</span></div></section>`;
  const me0=NAV.pos||ME_LOC,stops=missionStops(list),pts=[me0,...stops.map(c=>({lat:c.lat,lng:c.lng}))];
  let km=0;for(let k=1;k<pts.length;k++)km+=haversine(pts[k-1],pts[k]);
  const la=pts.map(p=>p.lat),ln=pts.map(p=>p.lng);let a0=Math.min(...la),a1=Math.max(...la),n0=Math.min(...ln),n1=Math.max(...ln);
  const pa=Math.max(.005,(a1-a0)*.3),pn=Math.max(.005,(n1-n0)*.3);a0-=pa;a1+=pa;n0-=pn;n1+=pn;
  const W=360,H=270,TOP=46,BOT=H-92,X=p=>(p.lng-n0)/(n1-n0)*W,Y=p=>TOP+(a1-p.lat)/(a1-a0)*(BOT-TOP);
  const P=pts.map(p=>[+X(p).toFixed(1),+Y(p).toFixed(1)]);
  const full=P.map((q,k)=>`${k?'L':'M'}${q[0]} ${q[1]}`).join(' ');
  const pins=stops.map((c,k)=>`<g class="ms-pin ${k===0?'on':''}" data-i="${k}" transform="translate(${P[k+1][0]} ${P[k+1][1]})"><circle class="mp-h" r="22" fill="${TYPES[c.type].c}"/><path class="mp-d" d="M0 -13L13 0L0 13L-13 0Z" fill="${TYPES[c.type].c}" stroke="#fff" stroke-width="3"/><text y="4.5" text-anchor="middle">${k+1}</text></g>`).join('');
  return `<section class="ms">
    <div class="ms-map">
      <svg id="msMap" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" data-pts='${JSON.stringify(P)}' aria-label="خريطة جولتك: ${stops.length} محطات">
        <defs><pattern id="msg" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="#DFE8EE" stroke-width="1"/></pattern>
          <linearGradient id="msf" x1="0" y1="0" x2="0" y2="1"><stop offset=".55" stop-color="#EEF3F7" stop-opacity="0"/><stop offset="1" stop-color="#EEF3F7"/></linearGradient></defs>
        <rect width="${W}" height="${H}" fill="#F3F7FA"/><rect width="${W}" height="${H}" fill="url(#msg)"/>
        <path d="${full}" fill="none" stroke="#9FB2C2" stroke-width="2.4" stroke-dasharray="2 7" stroke-linecap="round"/>
        <path id="msHi" d="M${P[0][0]} ${P[0][1]}L${P[1][0]} ${P[1][1]}" fill="none" stroke="#0B1420" stroke-width="3.2" stroke-linecap="round" class="ms-hi"/>
        <g transform="translate(${P[0][0]} ${P[0][1]})"><circle r="16" fill="#2E84E6" opacity=".16" class="ms-me"/><path d="M0 -7L7 0L0 7L-7 0Z" fill="#2E84E6" stroke="#fff" stroke-width="2.5"/></g>
        ${pins}
        <rect width="${W}" height="${H}" fill="url(#msf)" pointer-events="none"/>
      </svg>
      <div class="ms-over"><span class="ms-sum"><b>جولتك</b> · <span class="num">${stops.length}</span> ${stops.length===1?'محطة':stops.length===2?'محطتان':'محطات'} · <span class="num">${km.toFixed(1)}</span> كم</span>
        <button class="ms-full" data-act="tab" data-tab="f-map" aria-label="الخريطة الكاملة">${ic('map')}</button></div>
    </div>
    <div class="ms-cards" id="msCards">${stops.map((c,i)=>msCard(c,i)).join('')}</div>
    ${stops.length>1?`<div class="ms-dots">${stops.map((c,i)=>`<i class="${i===0?'on':''}"></i>`).join('')}</div>`:''}
  </section>`}
function initMission(root){
  const box=$('#msCards',root),svg=$('#msMap',root);if(!box||!svg||box._ms)return;box._ms=true;
  const P=JSON.parse(svg.dataset.pts||'[]'),hi=$('#msHi',svg);let cur=0,raf=0;
  const cards=[...box.querySelectorAll('.ms-card')];
  const focus=i=>{if(i===cur||i<0||i>=cards.length)return;cur=i;
    $$('.ms-pin',svg).forEach(g=>g.classList.toggle('on',+g.dataset.i===i));
    const a=P[i],b=P[i+1];if(hi&&a&&b){hi.setAttribute('d',`M${a[0]} ${a[1]}L${b[0]} ${b[1]}`);hi.classList.remove('go');void hi.getBoundingClientRect();hi.classList.add('go')}
    $$('.ms-dots i',root).forEach((d,k)=>d.classList.toggle('on',k===i));cards.forEach((c,k)=>c.classList.toggle('on',k===i));haptic(4)};
  cards[0]&&cards[0].classList.add('on');
  box.addEventListener('scroll',()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{
    const mid=box.getBoundingClientRect();const cx=mid.left+mid.width/2;let best=0,bd=1e9;
    cards.forEach((c,k)=>{const r=c.getBoundingClientRect();const d=Math.abs(r.left+r.width/2-cx);if(d<bd){bd=d;best=k}});focus(best)})},{passive:true});
  $$('.ms-pin',svg).forEach(g=>g.addEventListener('click',()=>{const k=+g.dataset.i;const c=cards[k];if(c)c.scrollIntoView({behavior:REDUCED?'auto':'smooth',inline:'center',block:'nearest'})}))}

/* ---------- البوصلة: الطريق إلى المخالفة ---------- */
const NAV={pos:null};
function bearing(a,b){const f1=a.lat*Math.PI/180,f2=b.lat*Math.PI/180,dl=(b.lng-a.lng)*Math.PI/180;
  const y=Math.sin(dl)*Math.cos(f2),x=Math.cos(f1)*Math.sin(f2)-Math.sin(f1)*Math.cos(f2)*Math.cos(dl);return (Math.atan2(y,x)*180/Math.PI+360)%360}
function dirWord(b){return ['شمال','شمال شرق','شرق','جنوب شرق','جنوب','جنوب غرب','غرب','شمال غرب'][Math.round(b/45)%8]}
/* ---------- العدسة: التصوير داخل المنصة بختم الموقع والوقت ---------- */
function lensStamp(){const p=NAV.pos||(form&&form.lat?{lat:form.lat,lng:form.lng}:ME_LOC);const d=new Date();
  const two=n=>String(n).padStart(2,'0');return {coords:`${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}`,time:`${two(d.getDate())}/${two(d.getMonth()+1)}/${d.getFullYear()} ${two(d.getHours())}:${two(d.getMinutes())}`}}
function openLens({max=5,mode='violation'}={}){
  return new Promise(async(resolve,reject)=>{
    if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)){reject(new Error('nocam'));return}
    let stream;try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false})}catch(e){reject(e);return}
    const shots=[];let md=mode;
    try{navigator.geolocation&&navigator.geolocation.getCurrentPosition(p=>{NAV.pos={lat:p.coords.latitude,lng:p.coords.longitude};const c=el.querySelector('.ln-chips .num');if(c)c.textContent=lensStamp().coords},()=>{},{enableHighAccuracy:true,timeout:8000,maximumAge:30000})}catch(e){}
    const el=document.createElement('div');el.className='lens';el.setAttribute('role','dialog');el.setAttribute('aria-label','التصوير');
    const st=lensStamp();
    el.innerHTML=`<video playsinline muted autoplay></video>
      <div class="ln-top"><button class="ln-x" data-l="close" aria-label="إغلاق">${ic('x')}</button><div class="ln-chips"><span><i></i><span class="num">${st.coords}</span></span><span class="num ln-clock">${st.time.slice(-5)}</span></div></div>
      <div class="ln-count" aria-live="polite"></div>
      <div class="ln-guide"><svg class="g-eye" viewBox="0 0 120 72" aria-hidden="true"><path d="M60 8H86L114 36L86 64H34L6 36L34 8Z" fill="none" stroke="#FFFFFF" stroke-width=".9" stroke-dasharray="3 2.4" opacity=".85"/><path d="M34 8H44M34 8L28 14M86 8H76M86 8L92 14M34 64H44M34 64L28 58M86 64H76M86 64L92 58" fill="none" stroke="#12D9AE" stroke-width="2.2"/></svg><i class="ln-scan"></i></div>
      <span class="ln-hint"></span>
      <div class="ln-mode"><button data-l="m-violation">المخالفة</button><button data-l="m-meter">لوحة العداد</button></div>
      <div class="ln-bar"><button class="ln-done" data-l="done">تم</button><button class="ln-shot" data-l="shot" aria-label="التقاط"><i></i><b></b></button><div class="ln-thumbs"></div></div>
      <i class="ln-flash"></i>`;
    document.body.appendChild(el);requestAnimationFrame(()=>el.classList.add('in'));
    const v=$('video',el);v.srcObject=stream;
    const paint=()=>{const n=shots.length;$('.ln-count',el).innerHTML=Array.from({length:max},(_,k)=>`<i class="${k<n?'f':''}"></i>`).join('')+`<b class="num">${n} من ${max}</b>`;
      $('.ln-thumbs',el).innerHTML=shots.slice(-2).map(s=>`<img alt="" src="${s.url}">`).join('');$('.ln-done',el).disabled=!n;
      $$('.ln-mode button',el).forEach(b=>b.classList.toggle('on',b.dataset.l==='m-'+md));el.classList.toggle('meter',md==='meter');
      $('.ln-hint',el).textContent=md==='meter'?'ضع لوحة العداد داخل الإطار':'ضع التعدّي داخل العين';$('.ln-shot',el).disabled=n>=max};
    paint();
    const finish=(ok)=>{stream.getTracks().forEach(t=>t.stop());el.classList.remove('in');setTimeout(()=>el.remove(),260);
      if(!ok)shots.forEach(s=>URL.revokeObjectURL(s.url));resolve(ok?shots.map(s=>s.file):[])};
    el.addEventListener('click',async e=>{const b=e.target.closest('[data-l]');if(!b)return;const a=b.dataset.l;
      if(a==='close')finish(false);else if(a==='done')finish(true);
      else if(a==='m-violation'||a==='m-meter'){md=a.slice(2);paint();haptic(4)}
      else if(a==='shot'){if(shots.length>=max||!v.videoWidth)return;
        const W=Math.min(1600,v.videoWidth),H=Math.round(W*v.videoHeight/v.videoWidth);const cv=document.createElement('canvas');cv.width=W;cv.height=H;const g=cv.getContext('2d');g.drawImage(v,0,0,W,H);
        const s=lensStamp(),bh=Math.round(H*0.06);g.fillStyle='rgba(11,20,32,0.72)';g.fillRect(0,H-bh,W,bh);g.fillStyle='#FFFFFF';g.font=`600 ${Math.round(bh*0.42)}px Tajawal, sans-serif`;g.textBaseline='middle';
        g.direction='rtl';g.textAlign='right';g.fillText(`عين · ${md==='meter'?'لوحة العداد':'المخالفة'} · ${s.time}`,W-bh*0.5,H-bh/2);g.direction='ltr';g.textAlign='left';g.fillText(s.coords,bh*0.5,H-bh/2);
        const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.86));if(!blob)return;
        const file=new File([blob],`ayn-${md}-${Date.now()}.jpg`,{type:'image/jpeg'});shots.push({file,url:URL.createObjectURL(blob)});
        const fl=$('.ln-flash',el);fl.classList.remove('go');void fl.offsetWidth;fl.classList.add('go');haptic(10);paint()}});
    const clk=setInterval(()=>{if(!el.isConnected){clearInterval(clk);return}const c=$('.ln-clock',el);if(c)c.textContent=lensStamp().time.slice(-5)},15000)})}
/* يلتقط بالعدسة إن توفّرت الكاميرا، وإلا يعود لاختيار ملف */
async function capturePhotos(max){try{const files=await openLens({max});return files}catch(e){const f=await pickPhoto();return f?[f]:[]}}

/* ---------- خيط التسليم: محادثة المخالفة بين المكتب والميدان ---------- */
function holderLabel(c){if(isClosed(c))return ['موثّقة في ممتثل','done'];if(c.status==='office'||c.status==='new')return ['الآن مع المكتب','office'];return ['الآن مع الميدان','field']}
function threadAction(c){const r=role();
  if(r==='office'||r==='admin'){if(c.status==='new')return ['assign','إسناد للميدان'];if(c.status==='office')return ['complete','استكمال بيانات العقار']}
  if(r==='field'&&c.assignee===me()){if(c.status==='field'&&!c.verified)return ['verify','تحقق ميداني'];if(c.status==='field'&&c.verified&&!c.dataComplete)return ['send-office','إرسال للمكتبي'];if(c.status==='field2'||(c.status==='field'&&c.dataComplete))return ['close-m','التسجيل في ممتثل']}
  return null}
SCREENS.thread=({id})=>{const c=byId(id);if(!c)return `${topbar({title:'غير موجودة',back:true})}<div class="empty">${ic('x')}المخالفة غير موجودة</div>`;
  const [hl,hk]=holderLabel(c),mine=me(),act=threadAction(c);
  const people=[c.assignedBy,c.assignee].filter((x,i,a)=>x&&a.indexOf(x)===i).slice(0,3);
  const items=(c.updates||[]).slice().sort((a,b)=>a.at-b.at);
  return `<div class="thr">
    <header class="th-h"><button class="cb" data-act="back" aria-label="رجوع">${ic('back')}</button>
      <button class="th-tt" data-act="open-case" data-id="${c.id}"><b><span class="num">${c.id}</span> · ${role()==='field'?esc(TYPES[c.type].l):esc(c.district)}</b><span class="th-hold ${hk}"><i></i>${hl}</span></button>
      <span class="th-ppl">${people.map(p=>avatar(p,'sm')).join('')}</span></header>
    <div class="th-list" id="thList">${items.map(u=>u.kind==='comment'
      ?`<div class="th-b ${u.who===mine?'is-me':''} ${u.role?'r-'+u.role:''}"><div class="th-bb">${esc(u.text)}</div><span>${esc(u.who)}${u.role?` · ${u.role==='field'?'الميدان':u.role==='office'?'المكتب':'الإدارة'}`:''} · ${rel(u.at)}</span></div>`
      :`<div class="th-sys"><i></i><span>${esc(u.text)} · <span class="num">${dshort(u.at)}</span></span></div>`).join('')}</div>
    <div class="th-foot">
      ${act?`<div class="th-acts"><button class="btn white th-act" data-act="${act[0]}" data-id="${c.id}">${act[1]}</button></div>`:''}
      ${role()==='platform'?'':`<div class="th-comp"><label for="thMsg" class="sr">رسالة للفريق</label><input id="thMsg" maxlength="500" placeholder="اكتب للفريق…" autocomplete="off"><button class="th-send" data-act="th-send" data-id="${c.id}" aria-label="إرسال"><i></i></button></div>`}
    </div></div>`};
function threadScroll(){const l=$('#thList');if(l)l.scrollTop=l.scrollHeight}

/* ---------- قصة الأسبوع ---------- */
const WEEK_KEY=()=>`ayn-story-${(S.user&&(S.user.username||S.user.name))||'x'}-${Math.floor(NOW/(7*DAY))}`;
function storyData(){const mine=me(),r=role(),since=NOW-7*DAY;
  if(r==='field'){const closed=S.cases.filter(c=>c.closedBy===mine&&(c.closedAt||0)>=since);
    const hand=S.cases.filter(c=>c.assignee===mine&&c.assignedAt&&(c.verifiedAt||c.dataAt)).map(c=>((c.verifiedAt||c.dataAt)-c.assignedAt)).filter(x=>x>0);
    const kinds={};S.cases.filter(c=>c.assignee===mine).forEach(c=>kinds[c.type]=(kinds[c.type]||0)+1);const top=Object.entries(kinds).sort((a,b)=>b[1]-a[1])[0];
    const team=S.cases.filter(c=>(c.closedAt||0)>=since).length;
    return {kash:'وثّقـــــــتَ',n:closed.length,unit:closed.length===1?'مخالفة حتى ممتثل':closed.length===2?'مخالفتين حتى ممتثل':'مخالفات حتى ممتثل',
      a:['أسرع تسليم منك',hand.length?fmtSpan(Math.min(...hand)):'—'],b:['أكثر ما وثّقت',top?TYPES[top[0]].l:'—'],team:['الفريق كله وثّق',`${team} هذا الأسبوع`]}}
  const assigned=S.cases.filter(c=>c.assignedBy===mine&&(c.assignedAt||0)>=since),data=S.cases.filter(c=>c.dataBy===mine&&(c.dataAt||0)>=since);
  const spans=S.cases.filter(c=>c.assignedBy===mine&&c.assignedAt).map(c=>c.assignedAt-c.createdAt).filter(x=>x>0);
  return {kash:'أسنـــــــدتَ',n:assigned.length,unit:'مخالفات إلى الميدان',a:['أكملتَ بيانات',`${data.length} عقار`],b:['أسرع إسناد منك',spans.length?fmtSpan(Math.min(...spans)):'—'],team:['بانتظار المكتب الآن',`${S.cases.filter(c=>c.status==='office'||c.status==='new').length}`]}}
function fmtSpan(ms){const h=ms/HOUR;if(h<1)return `${Math.max(1,Math.round(h*60))} دقيقة`;if(h<24)return `${Math.round(h)} ${Math.round(h)<=10&&Math.round(h)>=3?'ساعات':'ساعة'}`;const d=Math.round(h/24);return `${d} ${d===1?'يوم':d===2?'يومان':'أيام'}`}
function storyReady(){if(!['field','office'].includes(role()))return false;try{return !localStorage.getItem(WEEK_KEY())}catch(e){return false}}
function openStory(){
  const d=storyData();const frames=[
    `<span class="sy-k">${d.kash}</span><b class="sy-n num">${d.n}</b><span class="sy-u">${d.unit}</span>`,
    `<span class="sy-l">${d.a[0]}</span><b class="sy-big">${esc(d.a[1])}</b>`,
    `<span class="sy-l">${d.b[0]}</span><b class="sy-big">${esc(d.b[1])}</b>`,
    `<span class="sy-l">${d.team[0]}</span><b class="sy-big">${esc(d.team[1])}</b><span class="sy-u">أسبوع من عمل «عين»</span>`];
  try{localStorage.setItem(WEEK_KEY(),'1')}catch(e){}
  $$('.tb-me.story').forEach(b=>{b.classList.remove('story');b.dataset.act='tab'});
  const el=document.createElement('div');el.className='wkstory';el.setAttribute('role','dialog');el.setAttribute('aria-label','قصة أسبوعك');
  el.innerHTML=`<div class="sy-bars">${frames.map(()=>'<i><b></b></i>').join('')}</div>
    <div class="sy-top">${avatar(me(),'sm')}<span><b>أسبوعك في عيـــن</b><small>آخر 7 أيام</small></span><button class="sy-x" aria-label="إغلاق">${ic('x')}</button></div>
    <svg class="sy-art" viewBox="0 0 120 72" aria-hidden="true"><path d="M60 8H86L114 36L86 64H34L6 36L34 8Z" fill="none" stroke="#12D9AE" stroke-width="1.4"/><path d="M60 14L82 36L60 58L38 36Z" fill="none" stroke="#12D9AE" stroke-width="1.4"/></svg>
    <div class="sy-frame"></div>
    <div class="sy-foot"><button class="btn white sy-share">${ic('send')}شارك مع فريقك</button><small>المس اليسار للتالي واليمين للسابق</small></div>`;
  document.body.appendChild(el);requestAnimationFrame(()=>el.classList.add('in'));
  let i=0,timer=null;
  const show=k=>{i=Math.max(0,Math.min(frames.length-1,k));const f=$('.sy-frame',el);f.innerHTML=frames[i];f.classList.remove('go');void f.offsetWidth;f.classList.add('go');
    $$('.sy-bars i',el).forEach((b,j)=>{b.className=j<i?'done':j===i?'now':''});clearTimeout(timer);timer=setTimeout(()=>{if(i<frames.length-1)show(i+1)},5200)};
  const close=()=>{clearTimeout(timer);el.classList.remove('in');setTimeout(()=>el.remove(),260)};
  el.addEventListener('click',e=>{if(e.target.closest('.sy-x')){close();return}
    if(e.target.closest('.sy-share')){const txt=`أسبوعي في «عين»: ${d.kash.replace(/ـ/g,'')} ${d.n} ${d.unit} · ${d.a[0]}: ${d.a[1]} · ${d.b[0]}: ${d.b[1]}`;
      if(navigator.share)navigator.share({text:txt}).catch(()=>{});else{navigator.clipboard&&navigator.clipboard.writeText(txt);toast('نُسخ الملخّص للمشاركة','copy')}return}
    if(e.target.closest('.sy-foot'))return;const r=el.getBoundingClientRect();(e.clientX<r.left+r.width/2)?show(i+1):show(i-1)});
  show(0);haptic(8)}

/* ---------- شارة أيقونة التطبيق ---------- */
function appBadge(){try{if(!('setAppBadge' in navigator))return;const r=role();
  const n=r==='field'?S.cases.filter(c=>c.assignee===me()&&(c.status==='field'||c.status==='field2')).length:(r==='office'?S.cases.filter(c=>c.status==='new'||c.status==='office').length:0);

Object.assign(ACT,{
  'fh-seg':t=>{const i=+t.dataset.i;state.taskSeg=i===2?2:i;setTab('f-tasks')},
  'story':()=>openStory(),
  'go':t=>{const id=t.dataset.id||(state.route.params||{}).id;const c=byId(id);if(!c)return;closeAllSheets();

  'directions':t=>{const c=byId(t.dataset.id);if(!c)return;haptic(6);

    try{await api.comment(t.dataset.id,v);inp.value='';await sync();const l=$('#thList');const c=byId(t.dataset.id);
      if(l&&c){const u=[...c.updates].reverse().find(x=>x.kind==='comment'&&x.who===me());if(u){l.insertAdjacentHTML('beforeend',`<div class="th-b is-me ${u.role?'r-'+u.role:''} th-new"><div class="th-bb">${esc(u.text)}</div><span>${esc(u.who)} · الآن</span></div>`)}threadScroll()}haptic(6)}
    catch(e){apiErr(e,t)}finally{t.disabled=false}}
});

/* ===================== التشغيل ===================== */
(async function init(){
  bootSplash();
  const u=api.currentUser&&api.currentUser();
  if(u&&TABS[u.role]){S.user=u;S.role=u.role;await sync();if(S.role){state.route={name:TABS[S.role][0].n,params:{}};

  else{S.role=null;state.route={name:'entry',params:{}}}
  renderRoute('tab');
  let wasDesktop=DESKTOP();
  window.addEventListener('resize',()=>{renderTabbar();fitScreen();$$('.segc').forEach(moveSeg);
    if(DESKTOP()!==wasDesktop){wasDesktop=DESKTOP();if(['o-all','collab','f-new','f-home'].includes(state.route.name))refresh()}});
  window.addEventListener('orientationchange',()=>setTimeout(fitScreen,250));
  if('serviceWorker' in navigator&&window.AYN_MODE==='api'&&location.protocol==='https:'){
    navigator.serviceWorker.register('sw.js').then(()=>initPush()).catch(()=>{})}
})();
